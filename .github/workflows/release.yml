name: release

# Runs when a v* tag is pushed, OR on demand from the Actions tab ("Run workflow" → tag: v1.2.3).
# Builds the wheel + sdist, creates the GitHub release (and the tag, if it doesn't exist yet)
# with the notes from .github/release-body.md, and attaches the artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag (e.g. v1.0.0) — created at this commit if it doesn't exist"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build
        run: |
          pip install build
          python -m build
      - name: smoke-test the wheel
        run: |
          pip install dist/*.whl
          chode --version
      - name: create the GitHub release + attach wheel and sdist
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: CHODE ${{ github.event.inputs.tag || github.ref_name }} — code thicc like a tuna can
          body_path: .github/release-body.md
          files: dist/*
          make_latest: true
          fail_on_unmatched_files: true
